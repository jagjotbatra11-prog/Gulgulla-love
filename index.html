<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff0f5">
  <title>Sirji 🩷 × Gulgula</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <div class="hearts" aria-hidden="true">🩷 💗 💖</div>
    <p class="eyebrow">A tiny website made with love</p>
    <h1 id="heading">Sirji 🩷, ek important sawaal hai…</h1>
    <p id="message">Aap Gulgula ko officially lifetime tolerate karoge? 🥹</p>
    <div class="buttons" id="buttons">
      <button class="yes" id="yesBtn">Haan ji, bilkul! 💘</button>
      <button class="no" id="noBtn">Sochna padega 🙄</button>
    </div>
    <p id="response" class="response" aria-live="polite"></p>
    <div class="footer">Made by your Gulgula 🩷</div>
  </main>
  <div class="floating-hearts" aria-hidden="true"></div>
  <script src="script.js"></script>
</body>
</html>
